                    y=e.createElement(n);y.async=!0;y.src='https://pendo-dev-static.storage.googleapis.com/agent/static/'+apiKey+'/pendo.js';
                    z=e.getElementsByTagName(n)[0];z.parentNode.insertBefore(y,z);})(window,document,'script','pendo');

                pendo.initialize({

    <body>
        <button id="request-storage-access">Request storage access</button>
        Log of storage events:
        <div id="ls-logs"></div>
        <script>
            const lsLogs = document.getElementById('ls-logs');

            window.addEventListener('storage', (e) => {
                console.log('storage event', e)
                lsLogs.innerHTML = lsLogs.innerHTML + `
                    <div>
                        <b>${e.key}</b>: ${e.newValue}
                    </div>
                `;
            });

            // Internal RSA diagnostic event. Tracking must never break the page.
            const trackStorageAccessRequested = (properties) => {
                try {
                    if (window.pendo && typeof window.pendo.track === 'function') {
                        window.pendo.track('storage_access_requested', properties);
                    }
                } catch (err) {
                    console.warn('Pendo track failed: storage_access_requested', err);
                }
            };

            let storageHandles;
            const requestStorageAccessBtn = document.getElementById('request-storage-access');
            requestStorageAccessBtn.addEventListener('click', async () => {
                console.log("requestStorageAccessBtn clicked");
                // Gathered synchronously: requestStorageAccess() must stay the first
                // await so it still runs within the user gesture. This page has no
                // hasStorageAccess() poll, so the prior access state isn't reported.
                const properties = {
                    requested_types: 'all',
                    source_page: 'third-party-cookie-log',
                    is_embedded: window.self !== window.top
                };
                try {
                    storageHandles = await document.requestStorageAccess({ all: true });
                } catch (err) {
                    trackStorageAccessRequested({ ...properties, outcome: 'denied', error_name: err && err.name });
                    // Re-throw so the rejection still shows up in the console as before.
                    throw err;
                }
                trackStorageAccessRequested({ ...properties, outcome: 'granted' });
            });
        </script>
    </body>
</html>
